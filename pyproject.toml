[tool.poetry]
name = "construction-project-management"
version = "2.0.0"
description = "Backend REST 100% local en SQLite para memorias de gastos por obra"
authors = ["Developer <developer@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {version = "^0.28.0", extras = ["standard"]}
python-multipart = "^0.0.9"
pydantic = "^2.6.0"
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
python-dotenv = "^1.0.0"
pypdf = "^4.0.0"
pdfplumber = "^0.11.0"
openpyxl = "^3.1.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

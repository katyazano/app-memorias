[tool.poetry]
name = "construction-project-management"
version = "0.1.0"
description = "Database layer, REST API, and Streamlit Dashboard for Construction Project Management"
authors = ["Developer <developer@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {version = "^0.28.0", extras = ["standard"]}
python-multipart = "^0.0.9"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
sqlalchemy = {version = "^2.0.0", extras = ["asyncio"]}
asyncpg = "^0.29.0"
boto3 = "^1.34.0"
botocore = "^1.34.0"
alembic = "^1.13.0"
streamlit = "^1.32.0"
requests = "^2.31.0"
pandas = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
black = "^24.2.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
